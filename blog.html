      <article class="post">
        <p class="meta">Notes · Building &amp; AI</p>
        <h2 class="will-type" data-text="How I build things as a student"></h2>
        <p class="will-type" data-text="I am Dilshan Ansari, a Class 10 student from Dhanbad, Jharkhand. I build websites and AI agents. This is how I work."></p>
        <h3 class="will-type" data-text="Start with a real problem"></h3>
        <p class="will-type" data-text="Most of my projects start with something annoying that happens every day. Posting on Instagram. Checking school notices. Talking to strangers online. If it repeats, it can be automated."></p>
        <p class="will-type" data-text="I do not start with a big plan. I write down what the task is, what steps it has, and which steps a computer can do. Then I build the smallest version that works."></p>
        <h3 class="will-type" data-text="Use AI to move faster"></h3>
        <p class="will-type" data-text="AI tools help me write code, plan features and debug faster. But the decisions are mine. I decide what to build, how it should behave, and when it is good enough to ship."></p>
        <ul>
          <li class="will-type" data-text="AI writes the first draft, I check it."></li>
          <li class="will-type" data-text="I test everything myself before I show it to anyone."></li>
          <li class="will-type" data-text="If it breaks, I fix it and note what went wrong."></li>
        </ul>
        <h3 class="will-type" data-text="Ship, then improve"></h3>
        <p class="will-type" data-text="A working project teaches more than a perfect plan. I put things online early, get feedback, and improve from there. Smart Janta, JustYou, Deen-e-Islam and IndiaSite all grew this way."></p>
        <h3 class="will-type" data-text="If you are starting out"></h3>
        <p class="will-type" data-text="Pick one small thing and build it. Do not wait to feel ready. You learn by finishing, not by planning."></p>
      </article>

      <article class="post">
        <p class="meta">Notes · Automation</p>
        <h2 class="will-type" data-text="Why I automate the boring parts"></h2>
        <p class="will-type" data-text="Nobody likes doing the same thing twice. That is the whole reason I build agents — not to show off, but to stop wasting time."></p>
        <p class="will-type" data-text="My Instagram agent is the best example. Every day it creates a video, posts it, reads the comments and replies. It also answers direct messages. None of that needs me to sit and do it by hand."></p>
        <p class="will-type" data-text="The hard part is not writing the code. The hard part is making it reliable. A script that works once is easy. A script that works every day for a month is real work."></p>
        <h3 class="will-type" data-text="What I learned"></h3>
        <ul>
          <li class="will-type" data-text="Reliability beats cleverness. A simple script that always runs is worth more than a smart one that breaks."></li>
          <li class="will-type" data-text="Logs matter. When something fails at 3am, I need to know why without guessing."></li>
          <li class="will-type" data-text="Small steps. I add one feature at a time and test it before adding the next."></li>
        </ul>
        <p class="will-type" data-text="If you want to start automating, pick the one task you hate the most and write a script for it. That is how all of this started for me."></p>
      </article>

      <article class="post">
        <p class="meta">Notes · Design</p>
        <h2 class="will-type" data-text="What I look for in a good website"></h2>
        <p class="will-type" data-text="I have rebuilt my own site a few times now. Each time I learn something. Here is what I think matters."></p>
        <h3 class="will-type" data-text="It loads fast"></h3>
        <p class="will-type" data-text="People leave slow sites. I keep my pages light, my images small, and my code simple."></p>
        <h3 class="will-type" data-text="It works on a phone"></h3>
        <p class="will-type" data-text="Most people will see your site on a phone. If it is hard to use there, you have already lost them."></p>
        <h3 class="will-type" data-text="It says one thing clearly"></h3>
        <p class="will-type" data-text="A good homepage tells you who this is and what they do in a few seconds. Everything else is secondary."></p>
        <h3 class="will-type" data-text="It feels calm"></h3>
        <p class="will-type" data-text="Too many colours, too much movement, too many fonts. Restraint is what makes a site feel professional."></p>
      </article>

      <article class="post">
        <p class="meta">Notes · Learning</p>
        <h2 class="will-type" data-text="How I learn new things fast"></h2>
        <p class="will-type" data-text="I am still in school, so I do not have endless time. That forced me to learn efficiently. Here is what works for me."></p>
        <ul>
          <li class="will-type" data-text="Learn by building, not by watching. Tutorials are fine, but I stop early and start making."></li>
          <li class="will-type" data-text="Read error messages properly. The answer is usually right there."></li>
          <li class="will-type" data-text="Build the smallest version first, then add."></li>
          <li class="will-type" data-text="Write it down. If I do not note what I learned, I forget it."></li>
          <li class="will-type" data-text="Teach someone else. Explaining a thing is the best test of whether I understand it."></li>
        </ul>
        <p class="will-type" data-text="None of this is special. It just works, and it works for almost anything."></p>
      </article>
